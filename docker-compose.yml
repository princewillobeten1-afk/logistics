services:
  postgres:
    image: postgres:17-alpine
    container_name: logistics-pg
    environment:
      POSTGRES_USER: logistics
      POSTGRES_PASSWORD: logistics
      POSTGRES_DB: logistics
    # 5433 to stay clear of a local Postgres on the default port.
    ports:
      - "5433:5432"
    volumes:
      - logistics_pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U logistics -d logistics"]
      interval: 3s
      timeout: 3s
      retries: 20

volumes:
  logistics_pgdata:
